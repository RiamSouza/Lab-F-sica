<body>

    <header>
        <div class="header-container">
            <h1><i class="fa-solid fa-atom"></i> Banco de Dados de Experimentos</h1>
            <p>Monitoria de Física | IFSP</p>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h2><i class="fa-solid fa-plus"></i> Cadastrar Novo Experimento</h2>
            <form id="expForm">
                <div class="form-group">
                    <label for="nome">Nome do Experimento:</label>
                    <input type="text" id="nome" placeholder="Ex: Queda Livre com Sensor" required>
                </div>

                <div class="form-group">
                    <label for="area">Área da Física:</label>
                    <select id="area" required>
                        <option value="" disabled selected>Selecione a área...</option>
                        <option value="Mecânica">Mecânica</option>
                        <option value="Óptica">Óptica</option>
                        <option value="Termodinâmica">Termodinâmica</option>
                        <option value="Eletromagnetismo">Eletromagnetismo</option>
                        <option value="Ondulatória">Ondulatória</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="localizacao">Localização (Armário/Prateleira):</label>
                    <input type="text" id="localizacao" placeholder="Ex: Armário B - Prateleira 2">
                </div>

                <div class="form-group full-width">
                    <label for="componentes">Componentes / Equipamentos:</label>
                    <textarea id="componentes" rows="3" placeholder="Liste os itens necessários para o experimento..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Salvar Experimento</button>
            </form>
        </section>

        <section class="table-section">
            <div class="table-header">
                <h2><i class="fa-solid fa-flask"></i> Experimentos Catalogados</h2>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="busca" placeholder="Buscar experimento...">
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Área</th>
                            <th>Localização</th>
                            <th>Componentes</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaExperimentos">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
